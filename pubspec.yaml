name: data_logger
description: >-
  Buffered app and data logging for Dart and Flutter. Rows are written to
  TSV/CSV files on a background isolate, and any isolate can log to the same
  files.
version: 0.1.0
homepage: https://zeyus.com/

environment:
  sdk: ^3.9.0

dependencies:
  logging: ^1.3.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
